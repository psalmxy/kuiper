[package]
name = "mock-amm"
version = "0.1.0"
description = "Test-only constant-product AMM used by the kuiper-router LiteSVM tests"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program-entrypoint = "3"
solana-account-info = "3"
solana-program-error = "3"
solana-pubkey = "3"
solana-instruction = "3"
solana-cpi = "3"
solana-msg = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
